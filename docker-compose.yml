services:
  backend:
    build: ./backend
    container_name: democrazy_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: democrazy_frontend
    restart: always
    stdin_open: true
    tty: true
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
